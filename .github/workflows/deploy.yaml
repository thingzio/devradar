name: deploy

# Thin wrapper over the shared thingzio/actions deploy workflow. All this repo
# contributes is which resource gets which image, in which order, and which
# scheduler to hold still while it happens.
#
# https://github.com/thingzio/actions/blob/main/.github/workflows/deploy-cloud-run.md

on:
  workflow_call:
    inputs:
      delivery_image:
        type: string
        required: true
      scan_image:
        type: string
        required: true
      serve_image:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      delivery_image:
        description: Full devradar-deliver image reference pinned by digest
        type: string
        required: true
      scan_image:
        description: Full devradar-scan image reference pinned by digest
        type: string
        required: true
      serve_image:
        description: Full devradar-serve image reference pinned by digest
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: thingzio/actions/.github/workflows/deploy-cloud-run.yaml@a3528128e23e3bbc03b3982a9a9dc771bcf3e13f  # v1.5.0
    with:
      # Order matters and is part of the shared workflow's contract. Delivery
      # consumes outbox rows produced by serve, so the backward-compatible
      # consumer is updated before the producer that feeds it.
      targets: |
        job=devradar-saas-deliver=${{ inputs.delivery_image }}
        job=devradar-saas-scan=${{ inputs.scan_image }}
        service=devradar-saas-serve=${{ inputs.serve_image }}
      # Held paused for the rollout so a delivery run cannot start against a
      # half-updated pair. The shared workflow resumes it under always(), so a
      # failed deploy cannot leave delivery stopped -- which is what happened
      # when this logic lived here.
      scheduler_job: devradar-saas-deliver-scheduled
      # Fail-closed, as DEPLOYMENT.md has always specified: a failed rollout
      # leaves delivery paused for an operator to inspect rather than resuming
      # into a partially updated set. A successful rollout still resumes.
      #
      # The shared workflow defaults this to true, because a scheduler left
      # paused is the failure nobody is paged for. devradar opts out because
      # its runbook makes the opposite promise, and that promise is the
      # service's to make.
      resume_on_failure: false
