name: test-on-call

# Reusable qualify workflow: build, vet, lint, and the full test suite (incl.
# Postgres integration + live scanner tests). Called by both the push/PR `test`
# workflow and the tagged `release` workflow, so a release re-qualifies from
# scratch rather than trusting that main was green.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devradar
          POSTGRES_USER: devradar
          POSTGRES_PASSWORD: devradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devradar"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read Go version
        id: gover
        run: echo "go=$(yq -r '.languages.go' .settings.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ steps.gover.outputs.go }}"

      # syft/grype/trivy so the scanner, converter, and canonicalizer live tests
      # actually run in CI (they skip when the binaries are absent).
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration)
        env:
          DATABASE_URL: postgres://devradar:devradar@localhost:5432/devradar?sslmode=disable
        run: go test -count=1 -race -covermode=atomic -coverprofile=cover.out ./...

      - name: Coverage
        run: go tool cover -func=cover.out | grep total

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read versions
        id: v
        run: |
          echo "go=$(yq -r '.languages.go' .settings.yaml)" >> "$GITHUB_OUTPUT"
          echo "golangci=$(yq -r '.linting.golangci_lint' .settings.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ steps.v.outputs.go }}"

      - name: Formatting (gofmt)
        run: |
          unformatted="$(git ls-files -z -- '*.go' ':(exclude)vendor/**' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "${{ steps.v.outputs.golangci }}"

  # Infra + API-contract checks: Terraform formatting/validation and OpenAPI
  # spec validation. Kept separate from the Go lint job so a Terraform-only or
  # spec-only change still gets gated without pulling in the Go toolchain.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=infra/saas fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=infra/saas init -backend=false >/dev/null
          terraform -chdir=infra/saas validate

      - name: OpenAPI validate
        run: npx --yes @redocly/cli@1.34.2 lint pkg/server/static/openapi.yaml
