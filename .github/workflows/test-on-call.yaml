name: test-on-call

# Reusable qualify workflow: build, vet, lint, and the full test suite (incl.
# Postgres integration + live scanner tests). Called by both the push/PR `test`
# workflow and the tagged `release` workflow, so a release re-qualifies from
# scratch rather than trusting that main was green.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devradar
          POSTGRES_USER: devradar
          POSTGRES_PASSWORD: devradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devradar"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the version from go.mod, like every other Go job in the org. The
      # step this replaces read "1.27" out of .settings.yaml, which resolves to
      # whatever the latest 1.27.x happens to be on the day the job runs -- so
      # two runs of the same commit could use different toolchains.
      - uses: thingzio/actions/.github/actions/setup-go@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1

      # syft/grype/trivy so the scanner, converter, and canonicalizer live tests
      # actually run in CI (they skip when the binaries are absent).
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Test (unit + integration)
        env:
          DATABASE_URL: postgres://devradar:devradar@localhost:5432/devradar?sslmode=disable
        run: go test -count=1 -race -covermode=atomic -coverprofile=cover.out ./...

      - name: Coverage
        run: go tool cover -func=cover.out | grep total

  # gofmt, go vet and golangci-lint, at the org-pinned linter version. go vet
  # moved here from the test job below, which used to run it alongside the
  # Postgres-backed suite for no reason -- it needs no database.
  lint:
    uses: thingzio/actions/.github/workflows/lint-go.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1

  # API-contract check. Kept separate from the Go lint job so a spec-only change
  # is still gated without pulling in the Go toolchain.
  #
  # The Terraform fmt and validate steps that used to live here went to the
  # thingzio/infra repository along with infra/run, and run in its CI.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OpenAPI validate
        run: npx --yes @redocly/cli@1.34.2 lint pkg/server/static/openapi.yaml
