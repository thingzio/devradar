name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Workload Identity Federation (keyless GCP auth)

jobs:
  # Re-qualify from scratch on the tagged commit — the release does not assume
  # main was green. Same reusable flow the push/PR `test` workflow runs.
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read

  # Container images are built and published by the shared build definitions in
  # thingzio/actions, pinned by SHA. Pinning by SHA rather than tag makes the
  # SLSA provenance builder.id an immutable reference to the exact build
  # definition; verification is unaffected because --signer-workflow carries no
  # ref. See https://github.com/thingzio/actions/blob/main/docs/verification.md
  #
  # serve and deliver are pure Go, so ko builds them. scan carries grype, trivy,
  # and syft binaries at runtime and therefore needs a Dockerfile. Each call
  # builds one image; the three are independent and run in parallel.
  build-serve:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing
      attestations: write  # SLSA provenance + SBOM
    with:
      image: thingzio/devradar-serve
      main: ./cmd/devradar-serve
      platforms: linux/amd64,linux/arm64

  build-deliver:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: thingzio/devradar-deliver
      main: ./cmd/devradar-deliver
      platforms: linux/amd64,linux/arm64

  # arm64 is safe here despite the scanner binaries: the shared workflow maps
  # linux/arm64 to a native ubuntu-24.04-arm runner rather than emulating, and
  # the syft/grype/trivy install scripts detect the host architecture.
  build-scan:
    needs: test
    uses: thingzio/actions/.github/workflows/build-docker.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: thingzio/devradar-scan
      dockerfile: Dockerfile.scan
      platforms: linux/amd64,linux/arm64

  # Binaries, archives and a Sigstore-signed checksum file come from the shared
  # release definition, pinned by SHA for the same reason the image builds are.
  # It runs goreleaser in a job holding no OIDC token and signs the result in a
  # job that runs none of this repository's configuration, which is what makes
  # the provenance Build Level 3 rather than Level 2.
  #
  # publish: false because the draft flip is gated on a successful deploy, in
  # the publish job below. Everything is signed, verified and attested by the
  # time this returns; only visibility is deferred.
  release:
    needs: test
    uses: thingzio/actions/.github/workflows/release-go.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: write      # create the draft release, upload artifacts
      id-token: write      # keyless signing
      attestations: write  # SLSA provenance
    with:
      publish: false

  deploy:
    needs:
      - build-serve
      - build-deliver
      - build-scan
      - release
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      id-token: write
    with:
      delivery_image: ${{ needs.build-deliver.outputs.image_ref }}
      scan_image: ${{ needs.build-scan.outputs.image_ref }}
      serve_image: ${{ needs.build-serve.outputs.image_ref }}
    secrets: inherit

  # The release is created as a draft (`draft: true` in .goreleaser.yaml) and
  # the shared workflow leaves it that way (`publish: false` above), so a failed
  # deploy never leaves a published release pointing at images that were never
  # rolled out. Publishing is therefore a separate job gated on deploy
  # succeeding -- and it is now the only thing that will ever publish it, since
  # release-go does not come back later. Without this job the release stays a
  # draft forever, which is invisible to everyone but repository collaborators
  # and makes a repo with 55 releases look like it has none.
  #
  # devpulse and devtrace have had this step all along; devradar did not.
  publish:
    needs:
      - release
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
