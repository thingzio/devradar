name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Workload Identity Federation (keyless GCP auth)

jobs:
  # Re-qualify from scratch on the tagged commit — the release does not assume
  # main was green. Same reusable flow the push/PR `test` workflow runs.
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    environment: saas
    outputs:
      delivery_image: ${{ steps.bundle.outputs.delivery_image }}
      scan_image: ${{ steps.bundle.outputs.scan_image }}
      serve_image: ${{ steps.bundle.outputs.serve_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Go version
        id: gover
        run: echo "go=$(yq -r '.languages.go' .settings.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ steps.gover.outputs.go }}"

      # Keyless auth to GCP for pushing images (Artifact Registry). Mint a real
      # OAuth2 access token up front (token_format) so both the ko and docker
      # pushes authenticate from one token — rather than the docker credential
      # helper re-deriving a WIF token at push time, which fails on long builds
      # when the late STS token exchange is throttled (the v0.7.1 release error).
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Release (build + push serve[ko] and scan[docker] images)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sourced from .settings.yaml so the scan image's build stage cannot
          # drift from go.mod. Consumed by Dockerfile.scan via --build-arg.
          GO_VERSION: "${{ steps.gover.outputs.go }}"


      - name: Resolve immutable deployment bundle
        id: bundle
        env:
          REGISTRY: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/devradar-saas-images
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          delivery_digest=$(timeout 60s gcloud artifacts docker images describe \
            "${REGISTRY}/devradar-deliver:${TAG}" \
            --format='value(image_summary.digest)')
          scan_digest=$(timeout 60s gcloud artifacts docker images describe \
            "${REGISTRY}/devradar-scan:${TAG}" \
            --format='value(image_summary.digest)')
          serve_digest=$(timeout 60s gcloud artifacts docker images describe \
            "${REGISTRY}/devradar-serve:${TAG}" \
            --format='value(image_summary.digest)')
          for digest in "$delivery_digest" "$scan_digest" "$serve_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::invalid image digest" >&2
              exit 1
            }
          done
          {
            echo "delivery_image=${REGISTRY}/devradar-deliver@${delivery_digest}"
            echo "scan_image=${REGISTRY}/devradar-scan@${scan_digest}"
            echo "serve_image=${REGISTRY}/devradar-serve@${serve_digest}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      id-token: write
    with:
      delivery_image: ${{ needs.release.outputs.delivery_image }}
      scan_image: ${{ needs.release.outputs.scan_image }}
      serve_image: ${{ needs.release.outputs.serve_image }}
    secrets: inherit

  # goreleaser creates the release as a draft (`draft: true` in
  # .goreleaser.yaml) so a failed deploy never leaves a published release
  # pointing at images that were never rolled out. Publishing is therefore a
  # separate job gated on deploy succeeding -- without it the release stays a
  # draft forever, which is invisible to everyone but repository collaborators
  # and makes a repo with 55 releases look like it has none.
  #
  # devpulse and devtrace have had this step all along; devradar did not.
  publish:
    needs:
      - release
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
