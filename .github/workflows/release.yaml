name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Workload Identity Federation (keyless GCP auth)

jobs:
  # Re-qualify from scratch on the tagged commit — the release does not assume
  # main was green. Same reusable flow the push/PR `test` workflow runs.
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read

  # Container images are built and published by the shared build definitions in
  # thingzio/actions, pinned by SHA. Pinning by SHA rather than tag makes the
  # SLSA provenance builder.id an immutable reference to the exact build
  # definition; verification is unaffected because --signer-workflow carries no
  # ref. See https://github.com/thingzio/actions/blob/main/docs/verification.md
  #
  # serve and deliver are pure Go, so ko builds them. scan carries grype, trivy,
  # and syft binaries at runtime and therefore needs a Dockerfile. Each call
  # builds one image; the three are independent and run in parallel.
  build-serve:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@8cae31c35ffb538690dfd5ff1b9e4a00b3a265f8  # v1.0.1
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing
      attestations: write  # SLSA provenance + SBOM
    with:
      image: thingzio/devradar-serve
      main: ./cmd/devradar-serve
      platforms: linux/amd64,linux/arm64

  build-deliver:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@8cae31c35ffb538690dfd5ff1b9e4a00b3a265f8  # v1.0.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: thingzio/devradar-deliver
      main: ./cmd/devradar-deliver
      platforms: linux/amd64,linux/arm64

  # arm64 is safe here despite the scanner binaries: the shared workflow maps
  # linux/arm64 to a native ubuntu-24.04-arm runner rather than emulating, and
  # the syft/grype/trivy install scripts detect the host architecture.
  build-scan:
    needs: test
    uses: thingzio/actions/.github/workflows/build-docker.yaml@8cae31c35ffb538690dfd5ff1b9e4a00b3a265f8  # v1.0.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: thingzio/devradar-scan
      dockerfile: Dockerfile.scan
      platforms: linux/amd64,linux/arm64

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    environment: saas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read Go version
        id: gover
        run: echo "go=$(yq -r '.languages.go' .settings.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ steps.gover.outputs.go }}"

      - name: Build release artifacts (binaries, archives, checksums)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs:
      - build-serve
      - build-deliver
      - build-scan
      - release
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      id-token: write
    with:
      delivery_image: ${{ needs.build-deliver.outputs.image_ref }}
      scan_image: ${{ needs.build-scan.outputs.image_ref }}
      serve_image: ${{ needs.build-serve.outputs.image_ref }}
    secrets: inherit

  # goreleaser creates the release as a draft (`draft: true` in
  # .goreleaser.yaml) so a failed deploy never leaves a published release
  # pointing at images that were never rolled out. Publishing is therefore a
  # separate job gated on deploy succeeding -- without it the release stays a
  # draft forever, which is invisible to everyone but repository collaborators
  # and makes a repo with 55 releases look like it has none.
  #
  # devpulse and devtrace have had this step all along; devradar did not.
  publish:
    needs:
      - release
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
