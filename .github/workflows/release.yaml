name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Workload Identity Federation (keyless GCP auth)

jobs:
  # Re-qualify from scratch on the tagged commit — the release does not assume
  # main was green. Same reusable flow the push/PR `test` workflow runs.
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: test
    environment: saas
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read Go version
        id: gover
        run: echo "go=$(yq -r '.languages.go' .settings.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "${{ steps.gover.outputs.go }}"

      # Keyless auth to GCP for pushing images (Artifact Registry). Mint a real
      # OAuth2 access token up front (token_format) so both the ko and docker
      # pushes authenticate from one token — rather than the docker credential
      # helper re-deriving a WIF token at push time, which fails on long builds
      # when the late STS token exchange is throttled (the v0.7.1 release error).
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Log in to Artifact Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Release (build + push serve[ko] and scan[docker] images)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      id-token: write
    with:
      image_tag: ${{ github.ref_name }}
    secrets: inherit
