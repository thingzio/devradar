---
name: codeql

# CodeQL runs from the shared thingzio/actions workflow. The visibility gate,
# the explicit build, and the vendoring handling all live there now -- see
# https://github.com/thingzio/actions/blob/main/.github/workflows/codeql-go.md

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: thingzio/actions/.github/workflows/codeql-go.yaml@ec59857cacd694fc64ce83178eb3b444a170900d  # v1.1.0
