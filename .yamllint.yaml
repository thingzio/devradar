---
extends: default

rules:
  line-length: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false

ignore: |
  vendor/
  dist/
  .spike/
  # OpenAPI contract — hand-authored in flow style, validated by `redocly lint`,
  # not subject to the config-YAML style rules.
  pkg/server/static/openapi.yaml
