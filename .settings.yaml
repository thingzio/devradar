# Single source of truth for tool versions and quality thresholds.
# Consumed by the Makefile and CI workflows via yq.

# Language version
languages:
  go: '1.27'

# Build tools
build_tools:
  goreleaser: 'v2.17.1'
  ko: 'v0.19.1'

# Linting
linting:
  golangci_lint: 'v2.13.1'

# Pinned scanner binaries (baked into the scan-job image; the vuln DB is
# refreshed lazily at job start, not pinned here). Recorded per scan run.
scanners:
  grype: 'v0.115.0'
  trivy: 'v0.72.0'
  syft: 'v1.46.0'   # SPDX -> CycloneDX canonicalization in the scan job

# Quality thresholds
quality:
  # Set from measured coverage (68.8% on 2026-09-11) with ~2 points of slack.
  # Raise it when coverage rises; a gate that fails on a clean checkout is worse
  # than an honest lower number.
  coverage_threshold: '66'
  lint_timeout: '5m'
  test_timeout: '10m'
  build_timeout: '10m0s'
