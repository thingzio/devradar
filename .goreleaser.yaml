version: 2

project_name: devradar

builds:
  - id: devradar-serve
    binary: devradar-serve
    dir: ./cmd/devradar-serve
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: devradar-scan
    binary: devradar-scan
    dir: ./cmd/devradar-scan
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

release:
  github:
    owner: thingzio
    name: devradar
  prerelease: auto
  draft: true

# serve is pure Go → ko distroless image (no Dockerfile), like the siblings.
kos:
  - id: devradar-serve
    build: devradar-serve
    repositories:
      - us-west1-docker.pkg.dev/thingzio/devradar-saas-images/devradar-serve
    platforms:
      - linux/amd64
    tags:
      - latest
      - "{{.Tag}}"
    preserve_import_paths: false
    bare: true

# scan shells out to grype/trivy/syft at runtime, so its image is built from a
# multi-stage Dockerfile (scanners baked in) rather than ko. goreleaser passes
# the compiled binary's dir via build context; the Dockerfile rebuilds the Go
# binary in-stage for a self-contained image.
dockers:
  - id: devradar-scan
    dockerfile: Dockerfile.scan
    image_templates:
      - us-west1-docker.pkg.dev/thingzio/devradar-saas-images/devradar-scan:latest
      - us-west1-docker.pkg.dev/thingzio/devradar-saas-images/devradar-scan:{{ .Tag }}
    build_flag_templates:
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .ShortCommit }}"
      - "--build-arg=DATE={{ .CommitDate }}"
      - "--platform=linux/amd64"
    extra_files:
      - cmd
      - pkg
      - go.mod
      - go.sum

report_sizes: true

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - typo
