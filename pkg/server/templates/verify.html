{{template "head" .}}
<main class="page-content narrow">
  <div class="card" style="text-align:center; margin-top:3rem">
    <h1 class="page-title" style="margin-top:0">Confirm sign-in</h1>
    <p class="sub">You're one click away from signing in to DevRadar.</p>
    <form method="post" action="/auth/verify">
      <input type="hidden" name="token" value="{{.Token}}">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="btn" type="submit" style="margin-top:0.5rem">Sign in to DevRadar</button>
    </form>
    <p class="muted" style="margin-bottom:0; margin-top:1rem; font-size:0.85rem">
      This extra step protects your one-time link from being opened by automated
      email scanners before you can use it.
    </p>
  </div>
</main>
{{template "foot" .}}
