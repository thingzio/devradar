{{define "head"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — DevRadar</title>
  <meta name="description" content="Container vulnerability tracking — submit an SBOM, track how its vulnerabilities change over time.">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>{{end}}

{{define "nav"}}
<nav class="top-nav">
  <a href="{{if .SignedIn}}/overview{{else}}/{{end}}" class="top-nav-brand">
    <svg class="nav-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="12" x2="19" y2="5"/></svg>
    Dev<span class="accent">Radar</span>
  </a>
  {{if .SignedIn}}
  <div class="tabs">
    <a href="/overview" class="tab {{if eq .Tab "overview"}}active{{end}}">Overview</a>
    <a href="/dashboard" class="tab {{if eq .Tab "images"}}active{{end}}">Images</a>
    <a href="/cves" class="tab {{if eq .Tab "cves"}}active{{end}}">CVEs</a>
    <a href="/licenses" class="tab {{if eq .Tab "licenses"}}active{{end}}">Licenses</a>
    <a href="/submit" class="tab {{if eq .Tab "submit"}}active{{end}}">Submit</a>
    <a href="/api" class="tab {{if eq .Tab "api"}}active{{end}}">API</a>
  </div>
  <div class="user-menu-wrap">
    <button class="user-avatar-btn" id="user-menu-toggle" aria-label="Account menu" aria-haspopup="true" aria-expanded="false">
      {{if .AvatarURL}}<img class="user-avatar user-avatar-img" src="{{.AvatarURL}}" alt="" referrerpolicy="no-referrer">{{else}}<span class="user-avatar">{{if .Email}}{{slice .Email 0 1}}{{else}}?{{end}}</span>{{end}}
    </button>
    <div class="user-menu" id="user-menu" hidden>
      <div class="user-menu-header">{{.Email}}</div>
      <div class="user-menu-divider"></div>
      <a href="/tokens" class="user-menu-item">Settings</a>
      <div class="user-menu-divider"></div>
      <form method="post" action="/auth/logout"><button class="user-menu-item user-menu-signout" type="submit">Sign out</button></form>
    </div>
  </div>
  {{end}}
</nav>
{{end}}

{{define "foot"}}
<footer class="page-footer">
  <span>Container vulnerability tracking</span>
  <span>VERSION {{if .Version}}{{.Version}}{{else}}DEV{{end}}</span>
</footer>
</body>
</html>
{{end}}
